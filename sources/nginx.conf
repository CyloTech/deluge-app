user deluge;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr;

load_module modules/ndk_http_module.so;
load_module modules/ngx_http_lua_module.so;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    access_log /dev/stdout;
    
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 0;
    
    upstream deluge {
        server 127.0.0.1:8112;
    }
    
    server {
        listen 80;
        server_name _;
        
        # Fix cookie path: Deluge sets Path=/json, change to Path=/ so browser sends cookie to all endpoints
        proxy_cookie_path /json /;
        
        # ==============================================================
        # CVE-2025-46564: Block path traversal in /js endpoint
        # Prevents unauthenticated arbitrary file read via /js/deluge-all/../../
        # ==============================================================
        location /js {
            access_by_lua_block {
                local uri = ngx.var.request_uri
                -- Decode URL and check for path traversal (handles %2e%2e, etc.)
                local decoded = ngx.unescape_uri(uri)
                if string.find(decoded, "%.%.") or string.find(uri, "%.%.") then
                    ngx.status = 403
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say('{"success": false, "error": "Path traversal blocked"}')
                    return ngx.exit(403)
                end
            }
            
            proxy_pass http://deluge;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ==============================================================
        # CVE-2025-46563: Require authentication for /tracker endpoint
        # Prevents SSRF and information disclosure
        # ==============================================================
        location /tracker {
            access_by_lua_block {
                local session_id = ngx.var.cookie__session_id
                if not session_id or session_id == "" then
                    ngx.status = 403
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say('{"success": false, "error": "Authentication required"}')
                    return ngx.exit(403)
                end
                
                -- Validate session
                local cmd = string.format(
                    'curl -s --compressed "http://127.0.0.1:8112/json" ' ..
                    '-H "Content-Type: application/json" ' ..
                    '-H "Cookie: _session_id=%s" ' ..
                    '-d \'{"method": "auth.check_session", "params": [], "id": 1}\' 2>/dev/null',
                    session_id
                )
                local handle = io.popen(cmd)
                if not handle then
                    ngx.status = 403
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say('{"success": false, "error": "Session validation failed"}')
                    return ngx.exit(403)
                end
                local response = handle:read("*a")
                handle:close()
                
                if not response or (not string.find(response, '"result": true') and not string.find(response, '"result":true')) then
                    ngx.status = 403
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say('{"success": false, "error": "Invalid or expired session"}')
                    return ngx.exit(403)
                end
            }
            
            proxy_pass http://deluge;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ==============================================================
        # CVE-2025-46561: Require authentication for /flag endpoint
        # Prevents unauthenticated file read via path traversal
        # ==============================================================
        location /flag {
            access_by_lua_block {
                local session_id = ngx.var.cookie__session_id
                if not session_id or session_id == "" then
                    ngx.status = 403
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say('{"success": false, "error": "Authentication required"}')
                    return ngx.exit(403)
                end
                
                -- Validate session
                local cmd = string.format(
                    'curl -s --compressed "http://127.0.0.1:8112/json" ' ..
                    '-H "Content-Type: application/json" ' ..
                    '-H "Cookie: _session_id=%s" ' ..
                    '-d \'{"method": "auth.check_session", "params": [], "id": 1}\' 2>/dev/null',
                    session_id
                )
                local handle = io.popen(cmd)
                if not handle then
                    ngx.status = 403
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say('{"success": false, "error": "Session validation failed"}')
                    return ngx.exit(403)
                end
                local response = handle:read("*a")
                handle:close()
                
                if not response or (not string.find(response, '"result": true') and not string.find(response, '"result":true')) then
                    ngx.status = 403
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say('{"success": false, "error": "Invalid or expired session"}')
                    return ngx.exit(403)
                end
            }
            
            proxy_pass http://deluge;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ==============================================================
        # Original fix: Require authentication for /upload endpoint
        # Prevents unauthenticated plugin upload (RCE)
        # ==============================================================
        location /upload {
            access_by_lua_block {
                local session_id = ngx.var.cookie__session_id
                
                if not session_id or session_id == "" then
                    ngx.status = 403
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say('{"success": false, "error": "Authentication required"}')
                    return ngx.exit(403)
                end
                
                -- Validate session using curl (handles gzip decompression)
                local cmd = string.format(
                    'curl -s --compressed "http://127.0.0.1:8112/json" ' ..
                    '-H "Content-Type: application/json" ' ..
                    '-H "Cookie: _session_id=%s" ' ..
                    '-d \'{"method": "auth.check_session", "params": [], "id": 1}\' 2>/dev/null',
                    session_id
                )
                
                local handle = io.popen(cmd)
                if not handle then
                    ngx.log(ngx.ERR, "Failed to execute validation command")
                    ngx.status = 500
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say('{"success": false, "error": "Session validation failed"}')
                    return ngx.exit(500)
                end
                
                local response = handle:read("*a")
                handle:close()
                
                if not response or (not string.find(response, '"result": true') and not string.find(response, '"result":true')) then
                    ngx.status = 403
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say('{"success": false, "error": "Invalid or expired session"}')
                    return ngx.exit(403)
                end
            }
            
            proxy_pass http://deluge;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }
        
        # ==============================================================
        # Proxy all other requests to deluge-web
        # ==============================================================
        location / {
            proxy_pass http://deluge;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
    }
}
